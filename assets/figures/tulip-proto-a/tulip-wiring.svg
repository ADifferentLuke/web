<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="tw-d" width="100%" viewBox="0 0 680 650" role="img">
<title>Wiring diagram of tulip, the battery-powered time-lapse camera</title>
<desc>A battery feeds the Feather V2 BAT pin and a 3.3 V buck converter. The buck output powers the Arducam Mega camera and the microSD breakout. GPIO 32 enables the buck. The camera and the SD card share SCK, MOSI and MISO, with separate chip selects on GPIO 33 and GPIO 27. The SD ground is jumpered to the Feather ground.</desc>
<style>svg.tw-d{--fg:#0b0b0b;--mu:#52514e;--bgp:#fcfcfb;--coral-f:#FAECE7;--coral-s:#993C1D;--coral-t:#712B13;--coral-u:#993C1D;--teal-f:#E1F5EE;--teal-s:#0F6E56;--teal-t:#085041;--teal-u:#0F6E56;--gray-f:#F1EFE8;--gray-s:#5F5E5A;--gray-t:#444441;--gray-u:#5F5E5A}@media (prefers-color-scheme: dark){svg.tw-d{--fg:#f0efec;--mu:#c3c2b7;--bgp:#1a1a19;--coral-f:#712B13;--coral-s:#F0997B;--coral-t:#F5C4B3;--coral-u:#F0997B;--teal-f:#085041;--teal-s:#5DCAA5;--teal-t:#9FE1CB;--teal-u:#5DCAA5;--gray-f:#444441;--gray-s:#B4B2A9;--gray-t:#D3D1C7;--gray-u:#B4B2A9}}
svg.tw-d text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
svg.tw-d .t{font-size:14px;fill:var(--fg)}
svg.tw-d .ts{font-size:12px;fill:var(--mu)}
svg.tw-d .th{font-size:14px;font-weight:500;fill:var(--fg)}
svg.tw-d .bg{fill:var(--bgp)}
svg.tw-d .pl{stroke:var(--fg)}
svg.tw-d .c-coral>rect{fill:var(--coral-f);stroke:var(--coral-s)}
svg.tw-d .c-coral>.th{fill:var(--coral-t)}
svg.tw-d .c-coral>.ts{fill:var(--coral-u)}
svg.tw-d .c-teal>rect{fill:var(--teal-f);stroke:var(--teal-s)}
svg.tw-d .c-teal>.th{fill:var(--teal-t)}
svg.tw-d .c-teal>.ts{fill:var(--teal-u)}
svg.tw-d .c-gray>rect{fill:var(--gray-f);stroke:var(--gray-s)}
svg.tw-d .c-gray>.th{fill:var(--gray-t)}
svg.tw-d .c-gray>.ts{fill:var(--gray-u)}
</style>
<rect class="bg" x="0" y="0" width="680" height="650" rx="12"/>
<g class="c-coral">
<rect x="20" y="40" width="130" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="80" y="61" text-anchor="middle" dominant-baseline="central">Battery</text>
<text class="ts" x="80" y="80" text-anchor="middle" dominant-baseline="central">to Feather BAT</text>
<text class="ts" x="140" y="70" text-anchor="middle" dominant-baseline="central">+</text>
<text class="ts" x="60" y="92" text-anchor="middle" dominant-baseline="central">-</text>
</g>

<g class="c-coral">
<rect x="20" y="170" width="130" height="150" rx="8" stroke-width="0.5"/>
<text class="th" x="85" y="192" text-anchor="middle" dominant-baseline="central">3.3 V buck</text>
<text class="ts" x="85" y="210" text-anchor="middle" dominant-baseline="central">Adafruit 4711</text>
<text class="ts" x="142" y="230" text-anchor="end" dominant-baseline="central">Vin</text>
<text class="ts" x="142" y="260" text-anchor="end" dominant-baseline="central">En</text>
<text class="ts" x="50" y="306" text-anchor="middle" dominant-baseline="central">GND</text>
<text class="ts" x="120" y="306" text-anchor="middle" dominant-baseline="central">3V</text>
</g>

<g class="c-gray">
<rect x="230" y="40" width="150" height="490" rx="8" stroke-width="0.5"/>
<text class="th" x="305" y="62" text-anchor="middle" dominant-baseline="central">Feather V2</text>
<text class="ts" x="305" y="80" text-anchor="middle" dominant-baseline="central">ESP32</text>
<text class="ts" x="238" y="130" text-anchor="start" dominant-baseline="central">BAT</text>
<text class="ts" x="238" y="260" text-anchor="start" dominant-baseline="central">GPIO 32</text>
<text class="ts" x="372" y="100" text-anchor="end" dominant-baseline="central">GPIO 33 (cam CS)</text>
<text class="ts" x="372" y="240" text-anchor="end" dominant-baseline="central">SCK (GPIO 5)</text>
<text class="ts" x="372" y="265" text-anchor="end" dominant-baseline="central">MO (GPIO 19)</text>
<text class="ts" x="372" y="290" text-anchor="end" dominant-baseline="central">MI (MISO)</text>
<text class="ts" x="372" y="465" text-anchor="end" dominant-baseline="central">GPIO 27 (SD CS)</text>
<text class="ts" x="372" y="490" text-anchor="end" dominant-baseline="central">GND</text>
<text class="ts" x="305" y="345" text-anchor="middle" dominant-baseline="central">GPIO 35</text>
<text class="ts" x="305" y="362" text-anchor="middle" dominant-baseline="central">battery sense</text>
<text class="ts" x="305" y="379" text-anchor="middle" dominant-baseline="central">(onboard divider)</text>
</g>

<g class="c-teal">
<rect x="480" y="40" width="130" height="190" rx="8" stroke-width="0.5"/>
<text class="th" x="545" y="62" text-anchor="middle" dominant-baseline="central">Arducam Mega</text>
<text class="ts" x="545" y="80" text-anchor="middle" dominant-baseline="central">5MP SPI camera</text>
<text class="ts" x="488" y="100" text-anchor="start" dominant-baseline="central">CS</text>
<text class="ts" x="488" y="130" text-anchor="start" dominant-baseline="central">SCK</text>
<text class="ts" x="488" y="155" text-anchor="start" dominant-baseline="central">MOSI</text>
<text class="ts" x="488" y="180" text-anchor="start" dominant-baseline="central">MISO</text>
<text class="ts" x="602" y="100" text-anchor="end" dominant-baseline="central">VCC</text>
<text class="ts" x="520" y="214" text-anchor="middle" dominant-baseline="central">GND</text>
</g>

<g class="c-teal">
<rect x="480" y="320" width="130" height="190" rx="8" stroke-width="0.5"/>
<text class="th" x="545" y="342" text-anchor="middle" dominant-baseline="central">microSD</text>
<text class="ts" x="545" y="360" text-anchor="middle" dominant-baseline="central">SPI breakout</text>
<text class="ts" x="488" y="385" text-anchor="start" dominant-baseline="central">SCK</text>
<text class="ts" x="488" y="410" text-anchor="start" dominant-baseline="central">MOSI</text>
<text class="ts" x="488" y="435" text-anchor="start" dominant-baseline="central">MISO</text>
<text class="ts" x="488" y="465" text-anchor="start" dominant-baseline="central">CS</text>
<text class="ts" x="488" y="490" text-anchor="start" dominant-baseline="central">GND</text>
<text class="ts" x="602" y="385" text-anchor="end" dominant-baseline="central">3V</text>
</g>

