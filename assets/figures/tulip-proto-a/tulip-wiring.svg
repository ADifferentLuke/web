<path d="M185 130 H230" fill="none" stroke="#D85A30" stroke-width="1.5"/>
<circle cx="185" cy="130" r="3" fill="#D85A30"/>

<path d="M150 260 H230" fill="none" stroke="#1D9E75" stroke-width="1.5"/>
<text class="ts" x="190" y="247" text-anchor="middle">enable</text>

<path d="M120 320 V590 H645 V100 H610" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M610 385 H645" fill="none" stroke="#D85A30" stroke-width="1.5"/>
<circle cx="645" cy="385" r="3" fill="#D85A30"/>
<text class="ts" x="380" y="577" text-anchor="middle">3.3 V rail from buck</text>

<circle cx="120" cy="360" r="3" fill="#D85A30"/>
<path d="M120 360 H150 V370" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linejoin="round"/>
<path class="pl" d="M142 370 H158 M142 376 H158" fill="none" stroke-width="1.5"/>
<path d="M150 376 V386" fill="none" stroke="#888780" stroke-width="1.5"/>
<path d="M142 386 H158 M145 390 H155 M148 394 H152" fill="none" stroke="#888780" stroke-width="1.5"/>
<text class="ts" x="170" y="373" text-anchor="start">10 µF</text>

<circle cx="645" cy="525" r="3" fill="#D85A30"/>
<path d="M645 525 H630 V536" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linejoin="round"/>
<path class="pl" d="M622 536 H638 M622 542 H638" fill="none" stroke-width="1.5"/>
<path d="M630 542 V552" fill="none" stroke="#888780" stroke-width="1.5"/>
<path d="M622 552 H638 M625 556 H635 M628 560 H632" fill="none" stroke="#888780" stroke-width="1.5"/>
<text class="ts" x="614" y="539" text-anchor="end">100 µF</text>

<path d="M60 100 V108" fill="none" stroke="#888780" stroke-width="1.5"/>
<path d="M52 108 H68 M55 112 H65 M58 116 H62" fill="none" stroke="#888780" stroke-width="1.5"/>
<path d="M50 320 V330" fill="none" stroke="#888780" stroke-width="1.5"/>
<path d="M42 330 H58 M45 334 H55 M48 338 H52" fill="none" stroke="#888780" stroke-width="1.5"/>
<path d="M520 230 V244" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3"/>
<path d="M512 244 H528 M515 248 H525 M518 252 H522" fill="none" stroke="#888780" stroke-width="1.5"/>

<path d="M380 100 H480" fill="none" stroke="#1D9E75" stroke-width="1.5"/>
<path d="M380 465 H480" fill="none" stroke="#1D9E75" stroke-width="1.5"/>
<path d="M380 240 H427 M380 265 H427" fill="none" stroke="#1D9E75" stroke-width="1.5"/>
<path d="M380 290 H427" fill="none" stroke="#1D9E75" stroke-width="1.5"/>
<rect x="427" y="130" width="6" height="305" rx="2" fill="#1D9E75"/>
<path d="M433 130 H480 M433 155 H480 M433 180 H480 M433 385 H480 M433 410 H480 M433 435 H480" fill="none" stroke="#1D9E75" stroke-width="1.5"/>
<text class="ts" x="430" y="452" text-anchor="middle">shared SPI</text>

<path d="M380 490 H480" fill="none" stroke="#888780" stroke-width="2"/>
<text class="ts" x="430" y="507" text-anchor="middle">short jumper</text>

<path d="M30 628 H54" fill="none" stroke="#D85A30" stroke-width="1.5"/>
<text class="ts" x="60" y="628" dominant-baseline="central">Battery and 3.3 V power</text>
<path d="M215 628 H239" fill="none" stroke="#1D9E75" stroke-width="1.5"/>
<text class="ts" x="245" y="628" dominant-baseline="central">SPI and GPIO signal</text>
<path d="M375 628 H399" fill="none" stroke="#888780" stroke-width="1.5"/>
<text class="ts" x="405" y="628" dominant-baseline="central">Ground</text></svg>
